services:
  pbr_database:
    image: postgres:16-alpine
    container_name: pbr_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pbr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pbr}
      POSTGRES_DB: ${POSTGRES_DB:-pbr}
    volumes:
      - pbr_pg_data:/var/lib/postgresql/data
    # Bind to 127.0.0.1 so the host-networked backend can reach Postgres
    # without exposing it to the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pbr}"]
      interval: 10s
      timeout: 3s
      retries: 10

  pbr_redis:
    image: redis:7-alpine
    container_name: pbr_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pbr_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  pbr_backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: pbr_backend
    restart: unless-stopped
    depends_on:
      pbr_database:
        condition: service_healthy
      pbr_redis:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      PROBE_MODE: ${PROBE_MODE:-mock}
      PROBE_INTERFACE: ${PROBE_INTERFACE:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-32}
      MAX_TTL: ${MAX_TTL:-40}
      DOH_ENDPOINT: ${DOH_ENDPOINT:-https://dns.alidns.com/dns-query}
      DOH_BOOTSTRAP_IPS: ${DOH_BOOTSTRAP_IPS:-223.5.5.5,223.6.6.6}
      DOH_INSECURE: ${DOH_INSECURE:-false}
      DATABASE_URL: postgres://${POSTGRES_USER:-pbr}:${POSTGRES_PASSWORD:-pbr}@127.0.0.1:5432/${POSTGRES_DB:-pbr}?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      MMDB_CITY_PATH: /app/config/geoip/GeoLite2-City.mmdb
      MMDB_ASN_PATH: /app/config/geoip/GeoLite2-ASN.mmdb
      RIPE_CACHE_TTL_HOURS: ${RIPE_CACHE_TTL_HOURS:-24}
    # host networking is required for pcap probe mode: the backend needs
    # to open the real host interface (e.g. wlp129s0) and see its routing
    # table. In this mode the backend binds :8080 directly on the host.
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ../config/geoip:/app/config/geoip:ro

  pbr_frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: pbr_frontend
    restart: unless-stopped
    depends_on:
      - pbr_backend
    # Needed so nginx (inside the container) can reach the host-networked
    # backend at host.docker.internal:8080 on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:80"

volumes:
  pbr_pg_data:
  pbr_redis_data:
